services:
  app:
    build: .
    working_dir: /app
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - .:/app
    command: ["php", "-S", "0.0.0.0:8000", "-t", "public"]
    ports:
      - "127.0.0.1:8000:8000"

  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: propert_ease
      MYSQL_USER: propert_ease
      MYSQL_PASSWORD: local_password
      MYSQL_ROOT_PASSWORD: local_root_password
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  database_data: